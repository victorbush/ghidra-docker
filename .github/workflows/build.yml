# Publishes the image to Docker Hub when a GitHub release is published. The
# image is tagged like upstream's build script (e.g. 12.1.4_PUBLIC) and latest,
# and the release tag must be the same as the image tag. Releases marked as
# pre-releases don't move the latest tag.

name: Publish Docker image

on:
  release:
    types: [published]

env:
  IMAGE_NAME: victorbush/ghidra

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Download Ghidra
        id: ghidra
        run: ./build.sh --download-only

      - name: Check release tag matches image tag
        if: github.event.release.tag_name != steps.ghidra.outputs.tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IMAGE_TAG: ${{ steps.ghidra.outputs.tag }}
        run: |
          echo "::error::Release tag $RELEASE_TAG doesn't match image tag $IMAGE_TAG"
          exit 1

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.ghidra.outputs.tag }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.ghidra.outputs.context }}
          file: ${{ steps.ghidra.outputs.context }}/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: index.docker.io/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
