# Publishes the image to Docker Hub when a GitHub release is published. The
# image is tagged like upstream's build script (e.g. 12.1.4_PUBLIC) and latest,
# and the release tag must be the same as the image tag. Releases marked as
# pre-releases don't move the latest tag.

name: Publish Docker image

on:
  release:
    types: [published]

env:
  # Ghidra release zip to build
  GHIDRA_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip
  IMAGE_NAME: victorbush/ghidra

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Download Ghidra
        id: ghidra
        run: |
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 -o ghidra.zip "$GHIDRA_URL"
          unzip -q ghidra.zip
          dir="$(echo "$RUNNER_TEMP"/ghidra_*/)"
          # Same tag as upstream's build script: <version>_<release name>, e.g. 12.1.4_PUBLIC
          props="${dir}Ghidra/application.properties"
          version="$(sed -n 's/^application\.version=//p' "$props")"
          release_name="$(sed -n 's/^application\.release\.name=//p' "$props")"
          echo "tag=${version}_${release_name}" >> "$GITHUB_OUTPUT"
          echo "context=$dir" >> "$GITHUB_OUTPUT"

      - name: Check release tag matches image tag
        if: github.event.release.tag_name != steps.ghidra.outputs.tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IMAGE_TAG: ${{ steps.ghidra.outputs.tag }}
        run: |
          echo "::error::Release tag $RELEASE_TAG doesn't match image tag $IMAGE_TAG"
          exit 1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.ghidra.outputs.tag }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.ghidra.outputs.context }}
          file: ${{ steps.ghidra.outputs.context }}docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: index.docker.io/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
